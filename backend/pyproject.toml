[project]
name = "marcosscript-backend"
version = "0.1.0"
description = "FastAPI backend for MarcosScript photo events and processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "watchdog>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = [".."]
